name: Auto-Sync Exam Schedule (OTA)

on:
  schedule:
    - cron: '0 3 * * *' # Daily 8:30 AM IST
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Run exam date sync engine
        run: node scripts/sync_exam_dates.mjs

      - name: Validate ota/exam_schedule.json schema
        run: |
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("ota/exam_schedule.json", "utf8"));
            if (data.schema_version !== 1) throw new Error("schema_version must be 1");
            if (!Number.isInteger(data.revision) || data.revision <= 0) throw new Error("revision must be positive integer");
            if (!data.updated_at || Number.isNaN(Date.parse(data.updated_at))) throw new Error("updated_at invalid");
            const dateRe = /^\d{4}-\d{2}-\d{2}$/;
            for (const [k, v] of Object.entries(data.exams || {})) {
              if (!dateRe.test(v.official_date || "")) throw new Error(`${k}: invalid official_date`);
              if (!v.label || !String(v.label).trim()) throw new Error(`${k}: empty label`);
            }
            console.log(`Schema OK (rev ${data.revision})`);
          '

      - name: Commit & push updated OTA files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ota/exam_schedule.json ota/sync_log.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          REV=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("ota/exam_schedule.json", "utf8")).revision)')
          git commit -m "chore(ota): auto-sync exam schedule (rev ${REV})"
          git push

      - name: Open or update review issue for medium-confidence detections
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('ota/sync_log.json')) return;
            const log = JSON.parse(fs.readFileSync('ota/sync_log.json', 'utf8'));
            const pending = log.pending_review || [];
            if (pending.length === 0) return;

            const title = '[OTA Review] New unconfirmed exam dates detected';
            const lines = pending.map(p =>
              `- **${p.examKey}**: \`${p.detectedDate}\` (${p.confidence}) — [Source](${p.sourceUrl})\n  > ${p.snippet}`
            );
            const body = `Automated daily sync detected **${pending.length}** medium-confidence exam date(s).\n\nReview and apply in [OTA Admin](https://abhinab01.github.io/ota/admin.html):\n\n${lines.join('\n\n')}`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
